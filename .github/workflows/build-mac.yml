name: Build Argus AI for macOS

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target_flag: --arm64
          - os: macos-14
            arch: x64
            target_flag: --x64
    runs-on: ${{ matrix.os }}
    name: Build macOS (${{ matrix.arch }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-multipart
          pip install pyinstaller

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build React Frontend
        run: npm run build:frontend

      - name: Build Python Backend (${{ matrix.arch }})
        run: |
          npm run build:backend
          chmod -R 755 backend-dist

      - name: Test Native Standalone Backend (${{ matrix.arch }})
        run: |
          chmod +x backend-dist/argus-backend/argus-backend
          ./backend-dist/argus-backend/argus-backend &
          PID=$!
          echo "Started backend PID: $PID, waiting 6 seconds..."
          sleep 6
          echo "Testing /api/health..."
          curl -v http://127.0.0.1:18274/api/health
          echo "Testing /api/system/stats..."
          curl -v http://127.0.0.1:18274/api/system/stats
          kill -9 $PID || true

      - name: Prepare environment file
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Package macOS DMG & ZIP (${{ matrix.arch }})
        run: npx electron-builder --mac ${{ matrix.target_flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Build Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Argus-AI-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          retention-days: 14
