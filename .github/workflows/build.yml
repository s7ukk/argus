name: Build Installers (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn pydantic aiohttp python-dotenv psutil edge-tts

      - name: Build Standalone Backend with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --name argus-backend --distpath backend-dist run_backend.py

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build:frontend

      - name: Build Installer (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Installer (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Argus-AI-${{ matrix.os }}
          path: release/*.*
